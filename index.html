<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // NEURAL HANDSHAKE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070408;
      --card-bg: rgba(18, 10, 19, 0.92);
      --card-border: rgba(255, 0, 85, 0.35);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient cyber grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 0, 85, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Breathing sensory aura */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.18) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 5s ease-in-out infinite alternate;
    }

    .redirect-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--neon-pink);
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(255, 0, 85, 0.3);
      clip-path: polygon(
        0 0, 
        calc(100% - 25px) 0, 
        100% 25px, 
        100% 100%, 
        25px 100%, 
        0 calc(100% - 25px)
      );
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Top glowing corner indicator */
    .redirect-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 25px;
      height: 25px;
      background: linear-gradient(135deg, transparent 50%, var(--neon-pink) 50%);
    }

    /* Header Section */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      text-transform: uppercase;
      background: rgba(255, 0, 85, 0.09);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }

    .heartbeat-icon {
      width: 8px;
      height: 8px;
      background-color: var(--crimson-lust);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--crimson-lust);
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    h1 span {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }

    /* Central Radar / Biometric Ring */
    .scanner-hub {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(255, 0, 85, 0.4);
      animation: spin 10s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid var(--cyber-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      animation: spinReverse 6s linear infinite;
    }

    .countdown-display {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px var(--neon-pink);
      z-index: 2;
    }

    /* Target Portal Meta Box */
    .portal-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 0, 85, 0.3);
      border-left: 4px solid var(--crimson-lust);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .portal-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-bottom: 0.3rem;
    }

    .portal-destination {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--cyber-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid rgba(255, 0, 85, 0.3);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink), var(--cyber-cyan));
      box-shadow: 0 0 10px var(--neon-pink);
      transition: width 0.1s linear;
    }

    /* Live Telemetry Terminal Feed */
    .terminal-feed {
      background: #040204;
      border: 1px solid rgba(255, 0, 85, 0.25);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #ff758f;
      height: 85px;
      overflow-y: hidden;
      margin-bottom: 2rem;
      line-height: 1.6;
      border-radius: 2px;
    }

    /* Action Buttons */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .cyber-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      border: 1px solid transparent;
    }

    .btn-proceed {
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink));
      color: #fff;
    }

    .btn-proceed:hover {
      box-shadow: 0 0 25px var(--neon-pink);
      transform: scale(1.02);
    }

    .btn-abort {
      background: transparent;
      border-color: rgba(255, 0, 85, 0.4);
      color: var(--text-muted);
    }

    .btn-abort:hover {
      color: #fff;
      border-color: var(--crimson-lust);
      background: rgba(255, 0, 60, 0.1);
    }

    /* Keyframe Animations */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      15%, 45% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes ambientPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <main class="redirect-card">
    <div class="status-badge">
      <span class="heartbeat-icon"></span>
      NEURAL TUNNEL // SECURE HANDSHAKE
    </div>

    <h1 id="pageHeading">Routing <span>Relay</span></h1>
    <p class="subtitle" id="pageSubtitle">Synchronizing biometric bandwidth for transfer...</p>

    <!-- Pulsing Radar Countdown Hub -->
    <div class="scanner-hub">
      <div class="ring"></div>
      <div class="ring-inner"></div>
      <div class="countdown-display" id="timerCount">5</div>
    </div>

    <!-- Destination Information -->
    <div class="portal-box">
      <div class="portal-label">TARGET DESTINATION:</div>
      <div class="portal-destination" id="targetLabel">ESTABLISHING CONNECTION...</div>
    </div>

    <!-- Animated Progress Bar -->
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- Live Telemetry Stream -->
    <div class="terminal-feed" id="terminalFeed">
      <div>[00:00.12] Intercepting neural outbound packet...</div>
    </div>

    <!-- Action Buttons -->
    <div class="button-group">
      <button class="cyber-btn btn-abort" onclick="abortRedirect()">Abort Jump</button>
      <button class="cyber-btn btn-proceed" onclick="executeJump()">Instant Link &rarr;</button>
    </div>
  </main>

  <script>
    // 1. Read URL Parameters (?url=... & title=...)
    const urlParams = new URLSearchParams(window.location.search);
    const rawTarget = urlParams.get('url') || urlParams.get('to') || 'hetaira-db/index.html';
    const targetTitle = urlParams.get('title') || 'EXTERNAL NEURAL PORTAL';

    // Prevent script injections (safe URL validation)
    const targetUrl = (rawTarget.startsWith('http://') || rawTarget.startsWith('https://') || rawTarget.endsWith('.html') || rawTarget.startsWith('/')) 
      ? rawTarget 
      : 'https://hetaira-inc.github.io/hetaira-db/index.html';

    // Set Dynamic Titles
    document.getElementById('targetLabel').textContent = `${targetTitle} [${targetUrl}]`;

    // 2. Countdown Configuration
    const TOTAL_SECONDS = 5;
    let remaining = TOTAL_SECONDS;
    let isAborted = false;

    const timerCount = document.getElementById('timerCount');
    const progressBar = document.getElementById('progressBar');
    const terminal = document.getElementById('terminalFeed');

    // Sequential telemetry logs for high-tech aesthetic
    const telemetrySteps = [
      "[00:01.05] Biometric pulse verified at 432.8 Hz.",
      "[00:02.18] Handshake established. Tunnel encrypted (AES-512).",
      "[00:03.42] Bypassing localized sensory firewalls...",
      "[00:04.29] Synaptic coherence locked at 99.4%.",
      "[00:05.00] Transferring cognitive thread to target portal."
    ];

    let logIndex = 0;

    // Progress updates every 50ms for smooth animation
    const intervalMs = 50;
    const totalTicks = (TOTAL_SECONDS * 1000) / intervalMs;
    let currentTick = 0;

    const progressTimer = setInterval(() => {
      if (isAborted) return;

      currentTick++;
      const progressPercent = Math.min((currentTick / totalTicks) * 100, 100);
      progressBar.style.width = `${progressPercent}%`;

      // Update whole second countdown
      const secondsLeft = Math.ceil(TOTAL_SECONDS - (currentTick * intervalMs / 1000));
      if (secondsLeft >= 0) {
        timerCount.textContent = secondsLeft;
      }

      // Append logs sequentially
      if (currentTick % Math.floor(totalTicks / telemetrySteps.length) === 0 && logIndex < telemetrySteps.length) {
        const line = document.createElement('div');
        line.textContent = telemetrySteps[logIndex];
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
        logIndex++;
      }

      // Trigger automatic jump when done
      if (currentTick >= totalTicks) {
        clearInterval(progressTimer);
        executeJump();
      }
    }, intervalMs);

    // Instant execution
    function executeJump() {
      if (isAborted) return;
      window.location.href = targetUrl;
    }

    // Cancel / Abort
    function abortRedirect() {
      isAborted = true;
      clearInterval(progressTimer);

      document.getElementById('pageHeading').innerHTML = '<span style="color:var(--crimson-lust);">LINK SEVERED</span>';
      document.getElementById('pageSubtitle').textContent = 'Transmission sequence terminated by user command.';
      timerCount.textContent = '✕';
      timerCount.style.color = 'var(--crimson-lust)';
      progressBar.style.background = 'var(--crimson-lust)';

      const abortLine = document.createElement('div');
      abortLine.style.color = 'var(--crimson-lust)';
      abortLine.textContent = '[ABORT] Handshake cancelled. Safe retreat to Archive.';
      terminal.appendChild(abortLine);
      terminal.scrollTop = terminal.scrollHeight;

      setTimeout(() => {
        window.location.href = 'https://hetaira-inc.github.io/hetaira-db/index.html';
      }, 1200);
    }
  </script>
</body>
</html>
